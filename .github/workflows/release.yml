name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Build (Release, Developer ID)
        run: |
          xcodegen generate
          set -o pipefail
          xcodebuild -project Berth.xcodeproj -scheme Berth \
            -configuration Release \
            -derivedDataPath .build/DerivedData \
            -destination 'platform=macOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM=9XAXTT7H29 \
            build

      - name: Re-sign nested Sparkle helpers
        run: |
          SIGN_HASH=$(security find-identity -v -p codesigning | grep "Developer ID Application" | awk '{print $2}' | head -1)
          APP=".build/DerivedData/Build/Products/Release/Berth.app"
          FW="$APP/Contents/Frameworks/Sparkle.framework/Versions/B"
          for B in "$FW/Updater.app" "$FW/XPCServices/Installer.xpc" "$FW/XPCServices/Downloader.xpc" "$FW/Autoupdate" "$APP/Contents/Frameworks/Sparkle.framework" "$APP"; do
            codesign --force --options runtime --timestamp --sign "$SIGN_HASH" "$B"
          done

      - name: Read app version
        id: version
        run: |
          APP=".build/DerivedData/Build/Products/Release/Berth.app"
          SHORT=$(defaults read "$PWD/$APP/Contents/Info" CFBundleShortVersionString)
          BUILD=$(defaults read "$PWD/$APP/Contents/Info" CFBundleVersion)
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "App version: $SHORT ($BUILD)"

      - name: Verify tag matches app version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "${{ steps.version.outputs.short }}" ]; then
            echo "::error::Tag v$TAG does not match app version ${{ steps.version.outputs.short }}. Bump MARKETING_VERSION in project.yml and tag accordingly."
            exit 1
          fi

      - name: Verify code signature
        run: |
          codesign --verify --deep --strict --verbose=2 .build/DerivedData/Build/Products/Release/Berth.app

      - name: Package app
        run: |
          VERSION="${{ steps.version.outputs.short }}"
          mkdir -p .build/release
          ditto -c -k --keepParent \
            ".build/DerivedData/Build/Products/Release/Berth.app" \
            ".build/release/Berth-$VERSION.zip"

      - name: Notarize
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          VERSION="${{ steps.version.outputs.short }}"
          echo -n "$APPSTORE_API_KEY_P8" | base64 --decode -o "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit ".build/release/Berth-$VERSION.zip" \
            --issuer "$APPSTORE_ISSUER_ID" \
            --key-id "$APPSTORE_KEY_ID" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --wait
          xcrun stapler staple .build/DerivedData/Build/Products/Release/Berth.app
          spctl --assess --type execute --verbose=2 .build/DerivedData/Build/Products/Release/Berth.app
          rm ".build/release/Berth-$VERSION.zip"
          ditto -c -k --keepParent \
            ".build/DerivedData/Build/Products/Release/Berth.app" \
            ".build/release/Berth-$VERSION.zip"

      - name: Generate signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.short }}"
          SPARKLE_BIN=".build/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin"
          cp appcast.xml .build/release/appcast.xml
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_BIN/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/v$VERSION/" \
            ".build/release"
          cp .build/release/appcast.xml appcast.xml
          xmllint --noout appcast.xml

      - name: Commit appcast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "chore: update appcast for ${{ github.ref_name }}" || echo "Nothing to commit"
          git push origin HEAD:main

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.short }}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Berth $VERSION" \
            --generate-notes \
            ".build/release/Berth-$VERSION.zip"
